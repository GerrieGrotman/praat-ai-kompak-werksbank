<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Praat.ai kompak werksbank</title>
    <style>
      :root {
        color-scheme: light;
        --orange: #f2552a;
        --ink: #1c2430;
        --muted: #5c6b7a;
        --line: #e6e8ee;
        --bg: #f7f8fa;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        width: 320px;
        font-family: Inter, "Segoe UI", system-ui, sans-serif;
        color: var(--ink);
        background: #fff;
      }
      header {
        display: flex;
        gap: 12px;
        align-items: flex-start;
        padding: 16px 16px 12px;
        background: var(--bg);
        border-bottom: 1px solid var(--line);
      }
      header img { width: 32px; height: 32px; border-radius: 8px; flex: 0 0 auto; }
      h1 { margin: 0; font-size: 14px; font-weight: 650; letter-spacing: -0.01em; line-height: 1.25; }
      header p { margin: 3px 0 0; font-size: 12px; line-height: 1.4; color: var(--muted); }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 14px 16px;
      }
      .row span { font-size: 14px; font-weight: 600; }
      button.switch {
        width: 44px;
        height: 26px;
        border-radius: 999px;
        border: 0;
        padding: 0;
        background: #d5d8de;
        position: relative;
        cursor: pointer;
        flex: 0 0 auto;
      }
      button.switch[aria-checked="true"] { background: var(--orange); }
      button.switch::after {
        content: "";
        position: absolute;
        top: 3px;
        left: 3px;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: #fff;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
        transition: transform 0.15s ease;
      }
      button.switch[aria-checked="true"]::after { transform: translateX(18px); }
      button.switch:focus-visible { outline: 2px solid var(--orange); outline-offset: 2px; }
      footer {
        padding: 0 16px 16px;
        font-size: 12px;
        line-height: 1.45;
        color: var(--muted);
      }
      kbd {
        font-family: inherit;
        font-size: 11px;
        font-weight: 650;
        color: var(--ink);
        background: var(--bg);
        border: 1px solid var(--line);
        border-bottom-width: 2px;
        border-radius: 4px;
        padding: 0 4px;
      }
      #state { font-weight: 650; color: var(--ink); }
    </style>
  </head>
  <body>
    <header>
      <img src="icons/icon32.png" alt="" width="32" height="32" />
      <div>
        <h1>Praat.ai kompak werksbank</h1>
        <p>Makes the transcription page fit a laptop. The text box fills the screen.</p>
      </div>
    </header>
    <div class="row">
      <span id="state">Compact mode</span>
      <button class="switch" id="toggle" type="button" role="switch" aria-checked="true" aria-labelledby="state"></button>
    </div>
    <footer>
      On for praat.ai job pages. Press <span style="white-space:nowrap"><kbd>Alt</kbd>+<kbd>Shift</kbd>+<kbd>C</kbd></span> while transcribing to switch it off or on.
    </footer>
    <script src="popup.js"></script>
  </body>
</html>
